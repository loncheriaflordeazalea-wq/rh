<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RH · Flor de Azalea</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:       #f5f0eb;
  --surface:  #ffffff;
  --card:     #ffffff;
  --border:   #e8ddd4;
  --border2:  #d4c4b4;
  --orange:   #e65c00;
  --fire:     #f97316;
  --light-o:  #fff4ed;
  --gold:     #d97706;
  --light-g:  #fffbeb;
  --ink:      #1c1008;
  --muted:    #7a6050;
  --muted2:   #b09080;
  --green:    #16a34a;
  --light-gn: #f0fdf4;
  --blue:     #2563eb;
  --light-b:  #eff6ff;
  --pink:     #db2777;
  --light-p:  #fdf2f8;
  --red:      #dc2626;
  --shadow:   0 1px 3px rgba(0,0,0,.08), 0 4px 16px rgba(0,0,0,.06);
  --shadow-lg:0 4px 6px rgba(0,0,0,.07), 0 10px 30px rgba(0,0,0,.1);
  --r:        14px;
  --tf: 'Syne', sans-serif;
  --bf: 'Inter', sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--bf);background:var(--bg);color:var(--ink);min-height:100vh}

/* ── HEADER ── */
.hdr{background:var(--orange);color:white;padding:0 20px;display:flex;align-items:center;gap:14px;height:58px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(230,92,0,.35)}
.hdr-logo{width:36px;height:36px;background:rgba(255,255,255,.2);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0}
.hdr-t{font-family:var(--tf);font-size:1rem;font-weight:800;letter-spacing:-.2px}
.hdr-s{font-size:.68rem;opacity:.8;margin-top:1px}
.hdr-r{margin-left:auto;display:flex;align-items:center;gap:10px}
.hdr-upd{font-size:.7rem;opacity:.75}
.btn-ref{padding:6px 12px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);border-radius:8px;color:white;font-family:var(--bf);font-size:.75rem;cursor:pointer;transition:all .18s}
.btn-ref:hover{background:rgba(255,255,255,.3)}

/* ── STATS ── */
.stats-wrap{background:white;border-bottom:1px solid var(--border);padding:14px 20px}
.stats{display:flex;gap:10px;max-width:960px;margin:0 auto;flex-wrap:wrap}
.stat{flex:1;min-width:100px;background:var(--bg);border-radius:10px;padding:10px 14px;border:1px solid var(--border)}
.stat-n{font-family:var(--tf);font-size:1.3rem;font-weight:800;line-height:1}
.stat-l{font-size:.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:3px}

/* ── SUCURSALES CHIPS ── */
.sucursales-bar{background:white;border-bottom:1px solid var(--border);padding:10px 20px}
.sucursales{display:flex;gap:6px;max-width:960px;margin:0 auto;flex-wrap:wrap}
.suc-chip{padding:5px 14px;border-radius:999px;border:1.5px solid var(--border);background:transparent;color:var(--muted);font-family:var(--bf);font-size:.78rem;font-weight:500;cursor:pointer;transition:all .18s;white-space:nowrap}
.suc-chip.on{border-color:var(--orange);background:var(--light-o);color:var(--orange);font-weight:600}
.suc-chip:hover:not(.on){border-color:var(--muted2);color:var(--ink)}

/* ── TABS ── */
.tabs-wrap{background:white;border-bottom:2px solid var(--border);padding:0 20px}
.tabs{display:flex;max-width:960px;margin:0 auto}
.tab{padding:12px 18px;border:none;background:transparent;font-family:var(--bf);font-size:.85rem;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .18s;white-space:nowrap}
.tab.on{color:var(--orange);border-bottom-color:var(--orange);font-weight:600}
.tab:hover:not(.on){color:var(--ink)}

/* ── TOOLBAR ── */
.toolbar{padding:14px 20px;max-width:960px;margin:0 auto;display:flex;gap:8px;flex-wrap:wrap}
.search-wrap{flex:1;min-width:200px;position:relative}
.search-wrap input{width:100%;padding:9px 14px 9px 36px;background:white;border:1.5px solid var(--border);border-radius:10px;font-family:var(--bf);font-size:.85rem;color:var(--ink);outline:none;transition:border .2s;box-shadow:var(--shadow)}
.search-wrap input:focus{border-color:var(--orange)}
.search-wrap input::placeholder{color:var(--muted2)}
.search-ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:.85rem;pointer-events:none}

/* ── GRID ── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;padding:0 20px 60px;max-width:960px;margin:0 auto}

/* ── CARD ── */
.card{background:var(--card);border:1.5px solid var(--border);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);transition:transform .18s,box-shadow .18s,border-color .18s;animation:up .35s both}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:var(--border2)}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

.card-top-bar{height:4px;background:var(--border)}
.bar-hoy  {background:linear-gradient(90deg,#f59e0b,#d97706)}
.bar-man  {background:linear-gradient(90deg,#f97316,#e65c00)}
.bar-sem  {background:linear-gradient(90deg,#fb923c,#f97316)}
.bar-mes  {background:linear-gradient(90deg,#fed7aa,#fb923c)}

.card-body{padding:15px}

.card-row1{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px}
.av{width:44px;height:44px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-family:var(--tf);font-size:1.15rem;font-weight:800;flex-shrink:0;color:white}
.av-o{background:linear-gradient(135deg,#fb923c,#e65c00)}
.av-g{background:linear-gradient(135deg,#4ade80,#16a34a)}
.av-b{background:linear-gradient(135deg,#60a5fa,#2563eb)}
.av-p{background:linear-gradient(135deg,#f472b6,#be185d)}
.av-y{background:linear-gradient(135deg,#fbbf24,#d97706)}
.av-v{background:linear-gradient(135deg,#a78bfa,#7c3aed)}

.card-info{flex:1;min-width:0}
.card-nombre{font-weight:600;font-size:.92rem;line-height:1.2;color:var(--ink)}
.card-cargo{font-size:.73rem;color:var(--muted);margin-top:2px}
.card-chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.chip{font-size:.65rem;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.chip-suc {background:var(--light-b);color:var(--blue)}
.chip-niv {background:#f3e8ff;color:#7c3aed}
.chip-hoy {background:var(--light-g);color:var(--gold);border:1px solid #fde68a}
.chip-man {background:var(--light-o);color:var(--orange);border:1px solid #fed7aa}
.chip-sem {background:var(--light-p);color:var(--pink)}
.chip-mes {background:var(--light-b);color:var(--blue)}

hr.sep{border:none;border-top:1px solid var(--border);margin:0 0 11px}

.rows{display:flex;flex-direction:column;gap:5px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.rl{font-size:.67rem;text-transform:uppercase;letter-spacing:.4px;color:var(--muted2);flex-shrink:0}
.rv{font-size:.8rem;font-weight:500;color:var(--ink);text-align:right}
.rv-age{color:var(--orange);font-weight:700;font-family:var(--tf)}
.rv-hi{color:var(--green);font-weight:700}

.cumple-alert{margin-top:10px;border-radius:9px;padding:9px 11px;font-size:.78rem;line-height:1.4;display:flex;align-items:flex-start;gap:7px}
.cumple-hoy{background:var(--light-g);border:1px solid #fde68a;color:#92400e}
.cumple-prox{background:var(--light-o);border:1px solid #fed7aa;color:#9a3412}

/* ── VISTA CUMPLEAÑOS ── */
.prox-wrap{max-width:960px;margin:0 auto;padding:4px 20px 60px}
.section-title{font-family:var(--tf);font-size:.95rem;font-weight:700;color:var(--orange);margin:16px 0 10px;display:flex;align-items:center;gap:7px}
.prox-list{display:flex;flex-direction:column;gap:8px}
.prox-item{background:white;border:1.5px solid var(--border);border-radius:12px;padding:13px 16px;display:flex;align-items:center;gap:13px;box-shadow:var(--shadow);animation:up .3s both;transition:border-color .18s}
.prox-item:hover{border-color:var(--orange)}
.prox-av{width:40px;height:40px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-family:var(--tf);font-size:1rem;font-weight:800;color:white;flex-shrink:0}
.prox-info{flex:1}
.prox-n{font-weight:600;font-size:.88rem;color:var(--ink)}
.prox-c{font-size:.72rem;color:var(--muted);margin-top:1px}
.prox-f{font-size:.72rem;color:var(--orange);margin-top:3px;font-weight:500}
.prox-cnt{text-align:right;flex-shrink:0}
.prox-cnt-n{font-family:var(--tf);font-size:1.4rem;font-weight:800;color:var(--orange);line-height:1}
.prox-cnt-l{font-size:.62rem;color:var(--muted);margin-top:2px}

/* ── NÓMINA ── */
.nomina-wrap{max-width:960px;margin:0 auto;padding:4px 20px 60px}
.nomina-total{background:white;border:1.5px solid var(--border);border-radius:12px;padding:16px 20px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;box-shadow:var(--shadow)}
.nomina-total-lbl{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.nomina-total-val{font-family:var(--tf);font-size:1.6rem;font-weight:800;color:var(--green)}

.suc-group{margin-bottom:20px}
.suc-group-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;padding:0 2px}
.suc-group-name{font-family:var(--tf);font-size:.88rem;font-weight:700;color:var(--ink)}
.suc-group-sub{font-size:.75rem;color:var(--green);font-weight:600}

.nom-card{background:white;border:1.5px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:8px;box-shadow:var(--shadow);animation:up .3s both}
.nom-row1{display:flex;align-items:center;gap:12px;margin-bottom:11px}
.nom-info{flex:1}
.nom-nombre{font-weight:600;font-size:.88rem}
.nom-cargo{font-size:.72rem;color:var(--muted);margin-top:1px}
.nom-data{display:flex;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.nom-dato{background:var(--bg);border-radius:8px;padding:7px 10px;flex:1;min-width:80px}
.nom-dato-l{font-size:.62rem;color:var(--muted2);text-transform:uppercase;letter-spacing:.4px}
.nom-dato-v{font-size:.88rem;font-weight:600;margin-top:2px}

.horas-box{background:var(--light-o);border:1px solid #fed7aa;border-radius:9px;padding:10px 12px}
.horas-lbl{font-size:.67rem;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--orange);margin-bottom:7px}
.horas-row{display:flex;gap:7px;align-items:center}
.horas-inp{flex:1;padding:7px 10px;background:white;border:1.5px solid var(--border2);border-radius:8px;font-family:var(--bf);font-size:.88rem;color:var(--ink);outline:none;transition:border .2s;text-align:center}
.horas-inp:focus{border-color:var(--orange)}
.btn-save{padding:7px 14px;background:var(--orange);border:none;border-radius:8px;color:white;font-family:var(--bf);font-size:.78rem;font-weight:600;cursor:pointer;transition:opacity .18s;white-space:nowrap}
.btn-save:hover{opacity:.85}
.btn-save:disabled{opacity:.45;cursor:not-allowed}
.total-prev{margin-top:7px;font-size:.8rem;text-align:right;color:var(--muted)}
.total-prev strong{color:var(--green);font-family:var(--tf);font-size:.95rem}

/* ── ESTADO / EMPTY ── */
.estado{max-width:960px;margin:60px auto;padding:0 20px;text-align:center;color:var(--muted)}
.estado-ico{font-size:3rem;display:block;margin-bottom:12px}
.estado p{font-size:.88rem;line-height:1.6}

/* ── SETUP ── */
.setup-outer{max-width:480px;margin:50px auto;padding:0 20px}
.setup-card{background:white;border:1.5px solid var(--border);border-radius:18px;padding:28px 24px;box-shadow:var(--shadow-lg)}
.setup-card h2{font-family:var(--tf);font-size:1.15rem;color:var(--orange);margin-bottom:6px}
.setup-card p{font-size:.82rem;color:var(--muted);line-height:1.5;margin-bottom:18px}
.setup-lbl{font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);display:block;margin-bottom:6px}
.setup-row{display:flex;gap:8px}
.setup-inp{flex:1;padding:10px 13px;background:var(--bg);border:1.5px solid var(--border);border-radius:10px;font-family:var(--bf);font-size:.85rem;color:var(--ink);outline:none;transition:border .2s}
.setup-inp:focus{border-color:var(--orange)}
.setup-btn{padding:10px 18px;background:var(--orange);border:none;border-radius:10px;color:white;font-family:var(--bf);font-size:.85rem;font-weight:600;cursor:pointer}
.setup-btn:hover{opacity:.88}

/* ── TOAST ── */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:white;padding:10px 20px;border-radius:999px;font-size:.82rem;font-weight:500;transition:transform .3s cubic-bezier(.34,1.56,.64,1);z-index:999;pointer-events:none;white-space:nowrap;box-shadow:var(--shadow-lg)}
.toast.show{transform:translateX(-50%) translateY(0)}

@media(max-width:500px){
  .stats{gap:6px}
  .grid{grid-template-columns:1fr}
  .hdr-upd{display:none}
  .nomina-total{flex-direction:column;gap:4px;text-align:center}
}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-logo">🌸</div>
  <div><div class="hdr-t">Flor de Azalea</div><div class="hdr-s">Sistema de RH</div></div>
  <div class="hdr-r">
    <span class="hdr-upd" id="upd"></span>
    <button class="btn-ref" onclick="cargar()">↻ Actualizar</button>
  </div>
</div>

<!-- STATS -->
<div class="stats-wrap" id="stats-wrap" style="display:none">
  <div class="stats">
    <div class="stat"><div class="stat-n" id="sn-tot" style="color:var(--orange)">0</div><div class="stat-l">Empleados</div></div>
    <div class="stat"><div class="stat-n" id="sn-hoy" style="color:var(--gold)">0</div><div class="stat-l">Cumplen hoy 🎂</div></div>
    <div class="stat"><div class="stat-n" id="sn-prx" style="color:var(--fire)">0</div><div class="stat-l">Próximos 30d</div></div>
    <div class="stat"><div class="stat-n" id="sn-nom" style="color:var(--green)">$0</div><div class="stat-l">Nómina semana</div></div>
  </div>
</div>

<!-- SUCURSALES -->
<div class="sucursales-bar" id="suc-bar" style="display:none">
  <div class="sucursales" id="suc-chips"></div>
</div>

<!-- TABS -->
<div class="tabs-wrap" id="tabs-wrap" style="display:none">
  <div class="tabs">
    <button class="tab on"  onclick="setTab('equipo')">👥 Equipo</button>
    <button class="tab"     onclick="setTab('cumple')">🎂 Cumpleaños</button>
    <button class="tab"     onclick="setTab('nomina')">💰 Nómina</button>
  </div>
</div>

<!-- TOOLBAR -->
<div id="toolbar" style="display:none">
  <div class="toolbar">
    <div class="search-wrap">
      <span class="search-ico">🔍</span>
      <input type="text" id="q" placeholder="Buscar nombre o cargo…" oninput="render()">
    </div>
  </div>
</div>

<!-- CONTENIDO -->
<div id="main"></div>

<!-- SETUP -->
<div id="setup" style="display:none">
  <div class="setup-outer">
    <div class="setup-card">
      <h2>🔗 Conectar con Google Sheets</h2>
      <p>Pega la URL de tu Web App de Apps Script.<br>Se guarda en este navegador — solo se pide una vez.</p>
      <label class="setup-lbl">URL de la Web App (termina en /exec)</label>
      <div class="setup-row">
        <input class="setup-inp" id="url-inp" type="url" placeholder="https://script.google.com/macros/s/…/exec">
        <button class="setup-btn" onclick="conectar()">Conectar</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const LS  = "flor_api_v3";
let API   = localStorage.getItem(LS) || "";
let TAB   = "equipo";
let DATA  = [];
let SUC   = "todas";
const SUCURSALES = ["LFDA M","LFDA S1","PB","Local"];

(function init() {
  if (!API) document.getElementById("setup").style.display = "block";
  else cargar();
})();

function conectar() {
  const v = document.getElementById("url-inp").value.trim();
  if (!v.startsWith("https://")) { toast("⚠️ URL inválida"); return; }
  API = v; localStorage.setItem(LS, v);
  document.getElementById("setup").style.display = "none";
  cargar();
}

// ── CARGAR ────────────────────────────────────────────────
async function cargar() {
  showEstado("⏳","Cargando equipo…");
  try {
    const r    = await fetch(API + "?action=empleados&_=" + Date.now());
    const data = await r.json();
    if (!data.ok) throw new Error(data.error);
    DATA = data.empleados;
    renderStats(DATA);
    renderSucursales();
    showUI();
    render();
    document.getElementById("upd").textContent =
      "Actualizado " + new Date().toLocaleTimeString("es-MX",{hour:"2-digit",minute:"2-digit"});
  } catch(err) {
    showEstado("⚠️","No se pudo conectar.<br><small>" + err.message + "</small><br><br>" +
      `<button onclick="localStorage.removeItem('${LS}');location.reload()" style="margin-top:8px;padding:7px 16px;background:var(--orange);border:none;border-radius:8px;color:white;cursor:pointer;font-size:.8rem">Cambiar URL</button>`);
  }
}

// ── STATS ─────────────────────────────────────────────────
function renderStats(lista) {
  const fil  = filtrarSuc(lista);
  const hoy  = fil.filter(e => diasHasta(e.fechaNac)===0).length;
  const prx  = fil.filter(e => { const d=diasHasta(e.fechaNac); return d>0&&d<=30; }).length;
  const nom  = fil.reduce((s,e)=>s+(e.totalSemanal||0),0);
  document.getElementById("sn-tot").textContent = fil.length;
  document.getElementById("sn-hoy").textContent = hoy;
  document.getElementById("sn-prx").textContent = prx;
  document.getElementById("sn-nom").textContent = "$"+nom.toLocaleString("es-MX");
}

function renderSucursales() {
  const chips = document.getElementById("suc-chips");
  chips.innerHTML = `<button class="suc-chip ${SUC==="todas"?"on":""}" onclick="setSuc('todas')">Todas</button>` +
    SUCURSALES.map(s => `<button class="suc-chip ${SUC===s?"on":""}" onclick="setSuc('${s}')">${s}</button>`).join("");
}

function setSuc(s) {
  SUC = s;
  renderSucursales();
  renderStats(DATA);
  render();
}

function filtrarSuc(lista) {
  return SUC === "todas" ? lista : lista.filter(e => e.sucursal === SUC);
}

function showUI() {
  ["stats-wrap","suc-bar","tabs-wrap"].forEach(id => {
    document.getElementById(id).style.display = "";
  });
}

// ── TABS ─────────────────────────────────────────────────
function setTab(id) {
  TAB = id;
  document.querySelectorAll(".tab").forEach((b,i) =>
    b.classList.toggle("on", ["equipo","cumple","nomina"][i] === id)
  );
  document.getElementById("toolbar").style.display = id==="equipo" ? "" : "none";
  render();
}

function render() {
  if      (TAB==="equipo") renderEquipo();
  else if (TAB==="cumple") renderCumple();
  else if (TAB==="nomina") renderNomina();
}

// ── EQUIPO ────────────────────────────────────────────────
function renderEquipo() {
  const q = (document.getElementById("q")?.value||"").toLowerCase();
  const lista = filtrarSuc(DATA)
    .filter(e => e.nombre.toLowerCase().includes(q) || e.cargo.toLowerCase().includes(q))
    .sort((a,b) => diasHasta(a.fechaNac) - diasHasta(b.fechaNac));

  if (!lista.length) { showEstado("😶","Sin resultados."); return; }
  document.getElementById("main").innerHTML =
    `<div class="grid">${lista.map((e,i)=>cardHTML(e,i)).join("")}</div>`;
}

function cardHTML(e, idx) {
  const d    = diasHasta(e.fechaNac);
  const edad = edadExacta(e.fechaNac);
  const bar  = d===0?"bar-hoy":d===1?"bar-man":d<=7?"bar-sem":d<=30?"bar-mes":"";
  const ini  = e.nombre.charAt(0);
  const nxc  = nextCumple(e.fechaNac);

  // Badge días
  let badgeTxt = "", badgeCls = "";
  if      (d===0)  { badgeTxt="🎉 Hoy";    badgeCls="chip-hoy"; }
  else if (d===1)  { badgeTxt="🔔 Mañana"; badgeCls="chip-man"; }
  else if (d<=7)   { badgeTxt=`📅 ${d}d`;  badgeCls="chip-sem"; }
  else if (d<=30)  { badgeTxt=`🗓 ${d}d`;  badgeCls="chip-mes"; }

  let alerta = "";
  if (d===0)
    alerta = `<div class="cumple-alert cumple-hoy">🎉 <div><strong>¡Hoy cumple años!</strong><br>Felicita a ${e.nombre.split(" ")[0]}</div></div>`;
  else if (d<=7 && d>0)
    alerta = `<div class="cumple-alert cumple-prox">🎂 <div>Cumpleaños en <strong>${d} día${d!==1?"s":""}</strong> — ${nxc?fmtLg(nxc):""}</div></div>`;

  return `<div class="card" style="animation-delay:${idx*.04}s">
    <div class="card-top-bar ${bar}"></div>
    <div class="card-body">
      <div class="card-row1">
        <div class="av ${avColor(e.cargo)}">${ini}</div>
        <div class="card-info">
          <div class="card-nombre">${e.nombre}</div>
          <div class="card-cargo">${e.cargo}</div>
          <div class="card-chips">
            ${e.sucursal?`<span class="chip chip-suc">${e.sucursal}</span>`:""}
            ${e.nivel?`<span class="chip chip-niv">Niv. ${e.nivel}</span>`:""}
            ${badgeTxt?`<span class="chip ${badgeCls}">${badgeTxt}</span>`:""}
          </div>
        </div>
      </div>
      <hr class="sep">
      <div class="rows">
        <div class="row"><span class="rl">Edad</span><span class="rv rv-age">${edad||"—"}</span></div>
        <div class="row"><span class="rl">Nacimiento</span><span class="rv">${e.fechaNac?fmtSh(e.fechaNac):"—"}</span></div>
        <div class="row"><span class="rl">Antigüedad</span><span class="rv">${e.antiguedad||"—"}</span></div>
        <div class="row"><span class="rl">Inicio</span><span class="rv">${e.fechaInicio?fmtSh(e.fechaInicio):"—"}</span></div>
        ${e.habilidades?`<div class="row"><span class="rl">Habilidades</span><span class="rv" style="font-size:.72rem;color:var(--muted)">${e.habilidades}</span></div>`:""}
      </div>
      ${alerta}
    </div>
  </div>`;
}

// ── CUMPLEAÑOS ────────────────────────────────────────────
function renderCumple() {
  const lista = filtrarSuc(DATA)
    .filter(e => { const d=diasHasta(e.fechaNac); return d>=0&&d<=60; })
    .sort((a,b) => diasHasta(a.fechaNac)-diasHasta(b.fechaNac));

  if (!lista.length) { showEstado("😴","Nadie cumple en los próximos 60 días."); return; }

  document.getElementById("main").innerHTML = `
    <div class="prox-wrap">
      <div class="section-title">🎂 Próximos cumpleaños — 60 días</div>
      <div class="prox-list">${lista.map((e,i)=>proxHTML(e,i)).join("")}</div>
    </div>`;
}

function proxHTML(e, i) {
  const d   = diasHasta(e.fechaNac);
  const nxc = nextCumple(e.fechaNac);
  const edad = edadExacta(e.fechaNac);
  return `<div class="prox-item" style="animation-delay:${i*.05}s">
    <div class="prox-av ${avColor(e.cargo)}">${e.nombre.charAt(0)}</div>
    <div class="prox-info">
      <div class="prox-n">${e.nombre}</div>
      <div class="prox-c">${e.cargo} ${e.sucursal?"· "+e.sucursal:""}</div>
      <div class="prox-f">🎂 ${nxc?fmtLg(nxc):"—"} · ${edad}</div>
    </div>
    <div class="prox-cnt">
      <div class="prox-cnt-n">${d===0?"🎉":d}</div>
      <div class="prox-cnt-l">${d===0?"¡Hoy!":d===1?"mañana":"días"}</div>
    </div>
  </div>`;
}

// ── NÓMINA ────────────────────────────────────────────────
function renderNomina() {
  const lista = filtrarSuc(DATA).sort((a,b)=>a.nombre.localeCompare(b.nombre));
  const total = lista.reduce((s,e)=>s+(e.totalSemanal||0),0);

  // Agrupar por sucursal
  const grupos = {};
  lista.forEach(e => {
    const k = e.sucursal || "Sin sucursal";
    if (!grupos[k]) grupos[k] = [];
    grupos[k].push(e);
  });

  let gruposHTML = "";
  Object.entries(grupos).forEach(([suc, emps]) => {
    const subtotal = emps.reduce((s,e)=>s+(e.totalSemanal||0),0);
    gruposHTML += `
      <div class="suc-group">
        <div class="suc-group-head">
          <span class="suc-group-name">📍 ${suc}</span>
          <span class="suc-group-sub">$${subtotal.toLocaleString("es-MX")}</span>
        </div>
        ${emps.map((e,i)=>nomCardHTML(e,i)).join("")}
      </div>`;
  });

  document.getElementById("main").innerHTML = `
    <div class="nomina-wrap">
      <div class="nomina-total">
        <div class="nomina-total-lbl">Total nómina semanal${SUC!=="todas"?" · "+SUC:""}</div>
        <div class="nomina-total-val">$${total.toLocaleString("es-MX")}</div>
      </div>
      ${gruposHTML}
    </div>`;

  // Preview en tiempo real
  lista.forEach(e => {
    const inp = document.getElementById("inp-"+e.id);
    if (inp) inp.addEventListener("input", () => {
      const h = parseFloat(inp.value)||0;
      document.getElementById("prev-"+e.id).innerHTML =
        `Total: <strong>$${(h*e.costoHora).toLocaleString("es-MX")}</strong>`;
    });
  });
}

function nomCardHTML(e, i) {
  return `<div class="nom-card" style="animation-delay:${i*.04}s">
    <div class="nom-row1">
      <div class="av ${avColor(e.cargo)}" style="width:36px;height:36px;font-size:1rem">${e.nombre.charAt(0)}</div>
      <div class="nom-info">
        <div class="nom-nombre">${e.nombre}</div>
        <div class="nom-cargo">${e.cargo}</div>
      </div>
    </div>
    <div class="nom-data">
      <div class="nom-dato">
        <div class="nom-dato-l">Costo/hora</div>
        <div class="nom-dato-v">$${e.costoHora.toLocaleString("es-MX")}</div>
      </div>
      <div class="nom-dato">
        <div class="nom-dato-l">Horas semana</div>
        <div class="nom-dato-v" id="hdsp-${e.id}">${e.horasSemana}h</div>
      </div>
      <div class="nom-dato" style="background:var(--light-gn)">
        <div class="nom-dato-l">Total</div>
        <div class="nom-dato-v" id="tdsp-${e.id}" style="color:var(--green)">$${e.totalSemanal.toLocaleString("es-MX")}</div>
      </div>
    </div>
    <div class="horas-box">
      <div class="horas-lbl">✏️ Actualizar horas esta semana</div>
      <div class="horas-row">
        <input class="horas-inp" id="inp-${e.id}" type="number" min="0" max="80" step=".5" value="${e.horasSemana}" placeholder="hrs">
        <button class="btn-save" id="btn-${e.id}" onclick="guardarHoras('${e.id}',${e.costoHora})">Guardar</button>
      </div>
      <div class="total-prev" id="prev-${e.id}">Total: <strong>$${e.totalSemanal.toLocaleString("es-MX")}</strong></div>
    </div>
  </div>`;
}

// ── GUARDAR HORAS ─────────────────────────────────────────
async function guardarHoras(id, costoHora) {
  const inp   = document.getElementById("inp-"+id);
  const btn   = document.getElementById("btn-"+id);
  const horas = parseFloat(inp.value);
  if (isNaN(horas)||horas<0) { toast("⚠️ Número inválido"); return; }

  btn.disabled=true; btn.textContent="…";
  try {
    const r   = await fetch(`${API}?action=actualizarHoras&id=${encodeURIComponent(id)}&horas=${horas}&_=${Date.now()}`);
    const res = await r.json();
    if (!res.ok) throw new Error(res.error);

    document.getElementById("hdsp-"+id).textContent = horas+"h";
    document.getElementById("tdsp-"+id).textContent = "$"+res.total.toLocaleString("es-MX");

    const emp = DATA.find(e=>e.id===id);
    if (emp) { emp.horasSemana=horas; emp.totalSemanal=res.total; }
    renderStats(DATA);
    toast("✅ Guardado — Total: $"+res.total.toLocaleString("es-MX"));
  } catch(err) { toast("❌ "+err.message); }
  btn.disabled=false; btn.textContent="Guardar";
}

// ── HELPERS ───────────────────────────────────────────────
function diasHasta(fn) {
  if (!fn) return 9999;
  const hoy=new Date(), nac=new Date(fn+"T12:00:00");
  const c=new Date(hoy.getFullYear(),nac.getMonth(),nac.getDate());
  const hm=new Date(hoy.getFullYear(),hoy.getMonth(),hoy.getDate());
  if (c<hm) c.setFullYear(hoy.getFullYear()+1);
  return Math.round((c-hm)/86400000);
}
function nextCumple(fn) {
  if (!fn) return null;
  const hoy=new Date(), nac=new Date(fn+"T12:00:00");
  const c=new Date(hoy.getFullYear(),nac.getMonth(),nac.getDate());
  const hm=new Date(hoy.getFullYear(),hoy.getMonth(),hoy.getDate());
  if (c<hm) c.setFullYear(hoy.getFullYear()+1);
  return c.toISOString().slice(0,10);
}
function edadExacta(fn) {
  if (!fn) return "";
  const nac=new Date(fn+"T12:00:00"), hoy=new Date();
  let a=hoy.getFullYear()-nac.getFullYear();
  let m=hoy.getMonth()-nac.getMonth();
  if (m<0||(m===0&&hoy.getDate()<nac.getDate())) a--;
  return a+" años";
}
const MS=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const DS=["dom","lun","mar","mié","jue","vie","sáb"];
function fmtSh(s){ const d=new Date(s+"T12:00:00"); return `${d.getDate()} ${MS[d.getMonth()]} ${d.getFullYear()}`; }
function fmtLg(s){ const d=new Date(s+"T12:00:00"); return `${DS[d.getDay()]} ${d.getDate()} de ${MS[d.getMonth()]}`; }
const AVC=["av-o","av-g","av-b","av-p","av-y","av-v"];
function avColor(c){ let h=0; for(let i=0;i<(c||"").length;i++) h=(h*31+c.charCodeAt(i))%AVC.length; return AVC[h]; }
function showEstado(ic,msg){ document.getElementById("main").innerHTML=`<div class="estado"><span class="estado-ico">${ic}</span><p>${msg}</p></div>`; }
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),3000); }

setInterval(()=>{ if(API) cargar(); },5*60*1000);
</script>
